<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" href="uploads/1.png">
  <meta property="og:title" content="NPL Posto Neópolis">
  <meta property="og:description" content="Combustível de qualidade, troca de óleo e o Club Vip NPL. Alameda das Acácias, 1038 — Neópolis, Natal/RN.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="./npl-fx.js"></script>
  <style>
    html { scroll-behavior: smooth; overflow-x: clip; }
    body { margin: 0; background: #ffffff; font-family: 'Inter', sans-serif; color: #10243d; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4, h5, h6, button, input, select, textarea { font-family: 'Montserrat', sans-serif; }
    a { color: #004399; }
    a:hover { color: #00A972; }
  </style>
</helmet>

<dc-import name="SiteHeader" current="localizacao" hint-size="100%,140px"></dc-import>

<section data-screen-label="page-hero" style="background:linear-gradient(120deg,#004399 0%,#002a63 100%);padding:70px 20px">
  <div style="max-width:1240px;margin:0 auto">
    <div style="font-size:12.5px;font-weight:700;letter-spacing:0.14em;color:#7dd8b4;margin-bottom:14px">ONDE ESTAMOS</div>
    <h1 style="font-weight:800;font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-0.02em;color:#ffffff;margin:0;max-width:760px">Localização e contato</h1>
  </div>
</section>

<section data-screen-label="localizacao" style="background:#ffffff;padding:80px 20px">
  <div style="max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:50px;align-items:start">
    <div>
      <h2 style="font-weight:800;font-size:clamp(28px,3.6vw,42px);line-height:1.1;letter-spacing:-0.01em;color:#004399;margin:0 0 30px">Alameda das Acácias, 1038</h2>
      <div style="border-top:1px solid #e2e9f4;padding:20px 0;display:flex;justify-content:space-between;gap:20px">
        <span style="font-size:11.5px;font-weight:700;color:#8a99ae;letter-spacing:0.1em">BAIRRO</span>
        <span style="font-size:15px;color:#10243d;text-align:right;font-weight:500">Neópolis, Natal/RN — CEP 59080-560</span>
      </div>
      <div style="border-top:1px solid #e2e9f4;padding:20px 0;display:flex;justify-content:space-between;gap:20px">
        <span style="font-size:11.5px;font-weight:700;color:#8a99ae;letter-spacing:0.1em">HORÁRIO</span>
        <span style="font-size:15px;color:#10243d;text-align:right;font-weight:500">Todos os dias, das 6h às 22h</span>
      </div>
      <div style="border-top:1px solid #e2e9f4;padding:20px 0;display:flex;justify-content:space-between;gap:20px">
        <span style="font-size:11.5px;font-weight:700;color:#8a99ae;letter-spacing:0.1em">CONTATO</span>
        <span style="font-size:15px;color:#10243d;text-align:right;font-weight:500">(84) 99180-1090</span>
      </div>
      <div style="border-top:1px solid #e2e9f4;border-bottom:1px solid #e2e9f4;padding:20px 0;display:flex;justify-content:space-between;gap:20px">
        <span style="font-size:11.5px;font-weight:700;color:#8a99ae;letter-spacing:0.1em">INSTAGRAM</span>
        <a href="https://www.instagram.com/nplpostoneopolis/" target="_blank" rel="noopener" style="font-size:15px;text-align:right;font-weight:600;text-decoration:none">@nplpostoneopolis</a>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px">
        <a href="https://wa.me/5584991801090" target="_blank" rel="noopener" style="padding:15px 26px;background:#00A972;color:#ffffff;font-weight:700;border-radius:30px;text-decoration:none;font-size:15px">Chamar no WhatsApp</a>
        <a href="{{ directionsUrl }}" target="_blank" rel="noopener" style="padding:15px 26px;background:#004399;color:#ffffff;font-weight:700;border-radius:30px;text-decoration:none;font-size:15px">Traçar rota</a>
      </div>
    </div>
    <!-- TODO: confirmar o pino exato do mapa com o cliente -->
    <div style="position:relative;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%);box-shadow:0 10px 26px rgba(0,45,110,0.12)">
      <iframe title="Mapa — Posto Neópolis" src="{{ mapSrc }}" width="100%" height="440" style="border:0;display:block;filter:saturate(0.8) contrast(1.03) hue-rotate(-8deg)" loading="lazy"></iframe>
      <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(0,67,153,0.16);mix-blend-mode:multiply;pointer-events:none"></div>
      <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:6px;background:#00A972;transform:skewY(-0.8deg) translateY(2px);pointer-events:none"></div>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mapQuery&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Alameda das Acácias, 1038, Neópolis, Natal - RN&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const address = 'Alameda das Acácias, 1038, Neópolis, Natal - RN';
    const mapQuery = this.props.mapQuery ?? address;
    return {
      mapSrc: `https://www.google.com/maps?q=${encodeURIComponent(mapQuery)}&output=embed`,
      directionsUrl: `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`
    };
  }
}

</script>
</body>
</html>
